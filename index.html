{n:'Bein',f:'Vedlikehold: quads, hamstrings, legger, mage · tirsdag',fin:null,ex:[

{id:'pdown',n:'Nedtrekk, bredt grep',t:'w',sets:3,r:[8,12],rest:120,inc:5,def:55,warm:[[.5,8]],rir:[1,0],llp:1,alts:['Nedtrekk nøytralt grep','Enarms nedtrekk']},
{id:'crow',n:'Sittende kabelroing',t:'w',sets:3,r:[8,12],rest:120,inc:2.5,def:50,rir:[1,0],llp:1,alts:['Maskinroing','Brystforankret roing']},
{id:'lat',n:'Lean-in manual sidehev',t:'w',sets:4,r:[12,15],rest:60,ss:'B',inc:1,def:8,rir:[1,0],alts:['Kabel sidehev','Sidehev-maskin']},
{id:'rcross',n:'Reverse kabel crossover',t:'w',sets:3,r:[12,15],rest:60,ss:'B',inc:2.5,def:5,rir:[1,0],note:'Hold i kablene, ikke håndtakene',alts:['Reverse pec deck','Face pulls']},
{id:'inccurl',n:'Skrå manualcurl',t:'w',sets:3,r:[8,12],rest:75,ss:'A',inc:2,def:10,rir:[1,0],alts:['Bayesian kabelcurl','Preacher curl']},
{id:'tri',n:'Triceps pushdown (tau)',t:'w',sets:3,r:[10,15],rest:75,ss:'A',inc:2.5,def:25,rir:[1,0],alts:['Pushdown med stang','Dips-maskin']}]},
{n:'Overkropp C',f:'Tung benk, pull-ups, skuldre, armer · lørdag',fin:null,ex:[
{id:'bench',n:'Benkpress',t:'top',top:[5,6],bo:2,boR:[8,10],rest:180,bar:1,def:60,warm:W1,rir:[2,1],alts:['Manualpress flat','Smith-benkpress','Chest press-maskin']},
{id:'pull',n:'Pull-ups',t:'w',sets:3,r:[6,10],rest:150,add:1,inc:2.5,def:0,warm:[[-1,5]],rir:[1,0],llp:1,note:'Legg på vekt når du klarer 10',alts:['Nedtrekk nøytralt grep','Assistert pull-up']},
{id:'oarow',n:'Enarms kabelroing',t:'w',sets:2,r:[10,12],rest:90,inc:2.5,def:20,rir:[1,0],llp:1,note:'Per arm. Trekk albuen mot hofta',alts:['Hantelroing','Enarms maskinroing']},
{id:'yraise',n:'Kabel Y-hev',t:'w',sets:4,r:[12,15],rest:60,inc:2.5,def:5,rir:[1,0],alts:['Kabel sidehev','Lean-in manual sidehev']},
{id:'bcurl',n:'Bayesian kabelcurl',t:'w',sets:3,r:[10,15],rest:90,ss:'A',inc:2.5,def:10,rir:[1,0],note:'Arm bak kroppen',alts:['Kabelcurl','Skrå manualcurl']},
{id:'katana',n:'Katana kabel triceps',t:'w',sets:3,r:[10,15],rest:90,ss:'A',inc:2.5,def:10,rir:[1,0],alts:['Overhead kabel triceps','Skullcrushers']},
{id:'rpec',n:'Reverse pec deck, sideveis',t:'w',sets:2,r:[12,15],rest:60,inc:2.5,def:25,rir:[1,0],alts:['Reverse kabel crossover','Face pulls']}]}
];
const MAIN=[['bench','Benk'],['hack','Hack squat'],['pull','Pull-ups'],['incdb','Skrå manual']];
const ALL={};P.forEach(d=>d.ex.forEach(e=>ALL[e.id]=e));
const KEY='styrke_app_v1';let noStore=false;
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){noStore=true;return null}}
function metaObj(){return{settings:S.settings,nextDay:S.nextDay,block:S.block}}
// Lagrer lokalt. Endres innstillinger, neste dag eller blokk, får de nytt tidsstempel så synken vet hvilken versjon som er nyest.
function save(){if(S&&S.sync){const sig=JSON.stringify(metaObj());if(sig!==S.sync.sig){S.sync.sig=sig;S.sync.mu=Date.now()}}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){noStore=true}}
let S=load()||{settings:{has125:true},nextDay:0,sessions:[],active:null,prog:PROG};
// Nytt program: start på dag 1 og forkast en påbegynt økt fra det gamle programmet. Historikken beholdes.
// Programbytte: forkast en påbegynt økt. Fra program 2 beholdes dagrekkefølgen (samme fire dager), ellers start på dag 1.
if(S.prog!==PROG){if(!(S.prog>=2))S.nextDay=0;S.prog=PROG;S.active=null;save()}
// Blokk = 12 uker à 4 økter. Den starter ved første økt som bruker en øvelse fra det nye programmet.
const OLD_IDS=new Set(['bench','pull','incdb','csrow','squat','rdl','bulg','hlr','ohp','dips','crow','lat','face','bic','tri','dl','lp','lc','calf']);
function detectBlock(){const i=S.sessions.findIndex(s=>Object.keys(s.ex||{}).some(k=>!OLD_IDS.has(k.split('|')[0])));return{n:1,start:i<0?S.sessions.length:i,adj:0}}
if(!S.block){S.block=detectBlock();delete S.deload;delete S.intro;save()}
if(!S.backup)S.backup={n:0,date:null};
const PER_WEEK=4,WEEKS=12,DELOAD_WEEK=7,BACKUP_EVERY=8;
// Uke i blokka regnes ut fra antall fullførte økter, pluss en manuell justering i hele uker.
function week(){const done=Math.max(0,S.sessions.length-S.block.start+S.block.adj*PER_WEEK),w=Math.floor(done/PER_WEEK)+1;
return{w,inWeek:done%PER_WEEK+1,intro:w===1&&S.block.n===1,deload:w===DELOAD_WEEK,over:w>WEEKS}}
function sinceBackup(){return S.sessions.length-(S.backup.n||0)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
// ---- Synk med sky (Cloudflare Pages Function i functions/api/sync.js) ----
// Økter legges bare til og identifiseres med datoen sin, så sammenslåing mellom enheter er trygg.
// Nøkkelen lagres for seg selv på enheten og kommer aldri med i backup-fila.
const SYNC_LS='styrke_sync_key';
function syncKey(){try{return localStorage.getItem(SYNC_LS)||''}catch(e){return ''}}
function setSyncKey(v){try{v?localStorage.setItem(SYNC_LS,v):localStorage.removeItem(SYNC_LS);return true}catch(e){return false}}
function freshSync(){return{cursor:0,mu:0,sig:JSON.stringify(metaObj()),linked:false,at:null,err:'',total:null}}
if(!S.sync)S.sync=freshSync();
let syncing=false;
function mergeSessions(arr){const have=new Set(S.sessions.map(s=>s.date));let added=0;
arr.forEach(s=>{if(s&&typeof s.date==='string'&&s.ex&&!have.has(s.date)){s.sy=1;S.sessions.push(s);have.add(s.date);added++}});
if(added){S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);S.sessions.forEach((s,i)=>s.n=i+1)}return added}
function applyMeta(m){const d=m.data||{};if(d.settings)S.settings=d.settings;if(typeof d.nextDay==='number')S.nextDay=d.nextDay;if(d.block&&typeof d.block.start==='number')S.block=d.block;
S.sync.sig=JSON.stringify(metaObj());S.sync.mu=m.updated||0;if(!S.active)ui.sel=S.nextDay}
async function syncNow(manual){const key=syncKey();if(!key||syncing)return;if(!manual&&(S.active||!navigator.onLine))return;
syncing=true;ui.syncing=true;if(manual)render();
const first=!S.sync.linked;let since=first?0:(S.sync.cursor||0),out=S.sessions.filter(s=>first||!s.sy),more=true,last=null,guard=0,added=0;
try{while(more&&guard++<50){
const body={since,sessions:out.map(({sy,...rest})=>rest),meta:{data:metaObj(),updated:first?0:(S.sync.mu||0)}};let r;
try{r=await fetch('api/sync',{method:'POST',cache:'no-store',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify(body)})}catch(e){throw new Error('Ingen kontakt med serveren. Prøver igjen når du er på nett.')}
if(r.status===401){setSyncKey('');throw new Error('Feil synk-nøkkel. Skriv den inn på nytt.')}
if(r.status===404||r.status===405)throw new Error('Fant ikke synk-serveren. Synk virker bare på Cloudflare-adressen til appen.');
const j=await r.json().catch(()=>null);if(!r.ok||!j)throw new Error((j&&j.error)||('Feil fra serveren ('+r.status+')'));
out.forEach(s=>s.sy=1);out=[];added+=mergeSessions(j.sessions||[]);since=j.cursor||since;more=!!j.more;last=j}
S.sync.cursor=since;if(last.meta&&(first||last.meta.updated>(S.sync.mu||0)))applyMeta(last.meta);
S.sync.linked=true;S.sync.at=new Date().toISOString();S.sync.err='';S.sync.total=last.total;S.backup={n:S.sessions.length,date:S.sync.at};
if(manual||added)ui.syncMsg=added?'Hentet '+added+(added===1?' økt':' økter')+' fra skyen':'Alt er synket';
}catch(e){S.sync.err=e&&e.message?e.message:'Kunne ikke synke'}
syncing=false;ui.syncing=false;save();if(!S.active||manual)render()}
let ui={view:S.active?'work':'home',sel:S.nextDay,lift:'bench',alts:false,editT:false,err:'',io:null,ioErr:'',copied:false,sum:null,cf:'',msg:'',pending:null,syncing:false,syncMsg:''};
let draft=null,beeped=true,lastPh=-2,charts=[],ac=null,wl=null;
const fmt=n=>n==null||isNaN(n)?'–':String(Math.round(n*100)/100).replace('.',',');
const num=v=>{if(v==null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const rt=r=>r[0]===r[1]?String(r[0]):r[0]+'–'+r[1];
const e1=(w,r)=>w>0&&r>0?w*(1+r/30):0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dl=(n,d)=>d?Math.max(1,Math.round(n*.5)):n;
function stepFor(d){return d.bar?(S.settings.has125?2.5:5):(d.inc||2.5)}
function rnd(w,st){return w==null?null:Math.round(w/st)*st}
function keyOf(id){return S.active&&S.active.subs[id]?id+'|'+S.active.subs[id]:id}
function defOf(key){if(key.indexOf('|')<0)return ALL[key];const[id,alt]=key.split('|');const b=ALL[id];return Object.assign({},b,{id:key,n:alt,bar:0,def:null,warm:null,bw:0,add:0,inc:b.bar?2.5:(b.inc||2.5)})}
function wTxt(d,w){if(d.bw)return 'Kroppsvekt';if(w==null)return 'Velg vekt';if(d.add)return w>0?'+'+fmt(w)+' kg':'Kroppsvekt';return fmt(w)+' kg'}
function hist(key){return S.sessions.filter(s=>!s.deload&&s.ex[key]&&s.ex[key].sets.some(x=>x.k!=='warm')).reverse()}
// Failure (RPE 10) er planlagt på siste sett, så bare reps under intervallet teller som bom på vanlige øvelser.
function isMiss(d,sets){if(d.t==='top'){const s=sets.find(x=>x.k==='top');return s?(s.r<d.top[0]||(s.rpe||8)>=10):false}return sets.filter(x=>x.k==='work').some(x=>x.r<d.r[0])}
function effort(it,d){if(it.k==='warm')return 'Lett og raskt';const A=S.active;if(A&&A.deload)return 'RIR 3, ingen LLP';if(A&&A.intro)return 'RIR 2–3, ingen LLP (introuke)';
const R=d.rir||[2,1],last=it.k==='top'||(it.k==='work'&&it.i===it.n-1),r=last?R[1]:R[0];
return 'RIR '+r+(r===0?' (failure)':'')+(last&&d.llp?' + LLP':'')}
function computeTarget(key,deload){
const d=defOf(key),st=stepFor(d),inc=d.bar?st:(d.inc||2.5),h=hist(key),R=d.t==='top'?d.top:d.r;
let T={w:d.bw?0:d.def,goal:R[0],status:'new',note:d.def==null?'Velg vekt for '+d.n:'Første gang: juster vekten',prev:[]};
if(h.length){const sets=h[0].ex[key].sets;T.prev=sets;let ref,up;
if(d.t==='top'){ref=sets.find(x=>x.k==='top')||sets.find(x=>x.k!=='warm');up=ref.k==='top'&&ref.r>=R[1]&&(ref.rpe||8)<=8}
else{const ws=sets.filter(x=>x.k==='work');if(ws.length){ref=ws[0];up=ws.every(x=>x.r>=R[1])}else{ref=sets.find(x=>x.k!=='warm');up=false}}
const w=ref.w,miss=isMiss(d,sets);
if(d.bw){T.w=0;if(up){T.status='up';T.goal=R[1];T.note='Toppen nådd: prøv tyngre variant'}else{T.status='hold';T.goal=null;T.note='Én rep mer per sett'}}
else if(up){T.w=rnd(w+inc,st);T.status='up';T.goal=R[0];T.note='Ny vekt: +'+fmt(inc)+' kg'}
else if(miss){const pm=h[1]&&isMiss(d,h[1].ex[key].sets);if(pm){T.w=rnd(w*.95,st);T.status='down';T.note='To bom på rad: ned 5 %'}else{T.w=w;T.status='miss';T.note='Bom sist: samme vekt'}T.goal=R[0]}
else{T.w=w;T.status='hold';T.goal=d.t==='top'?Math.min(R[1],ref.r+1):null;T.note=d.t==='top'&&(ref.rpe||8)>=9?'RPE 9 sist: samme vekt':'Samme vekt, én rep mer'}}
if(deload&&T.w!=null){T.w=rnd(T.w*.9,st);T.goal=R[0];T.status='deload';T.note='Deload: lett uke'}
return T}
function buildQueue(day,deload){const ex=P[day].ex,q=[];let i=0;
while(i<ex.length){const e=ex[i];
if(e.ss&&ex[i+1]&&ex[i+1].ss===e.ss){const a=e,b=ex[i+1],na=dl(a.sets,deload),nb=dl(b.sets,deload);for(let s=0;s<Math.max(na,nb);s++){if(s<na)q.push({ex:a.id,k:'work',i:s,n:na,ss:1,rest:s<nb?0:a.rest});if(s<nb)q.push({ex:b.id,k:'work',i:s,n:nb,ss:2,rest:b.rest})}i+=2;continue}
if(e.warm)e.warm.forEach((x,j)=>q.push({ex:e.id,k:'warm',i:j,n:e.warm.length,pct:x[0],reps:x[1],rest:j===e.warm.length-1?60:0}));
if(e.t==='top'){q.push({ex:e.id,k:'top',i:0,n:1,rest:e.rest});const nb=dl(e.bo,deload);for(let s=0;s<nb;s++)q.push({ex:e.id,k:'back',i:s,n:nb,rest:120})}
else{const n=dl(e.sets,deload);for(let s=0;s<n;s++)q.push({ex:e.id,k:'work',i:s,n,rest:e.rest})}
i++}return q}
function itemInfo(it){const A=S.active,key=keyOf(it.ex),d=defOf(key);if(!A.targets[key])A.targets[key]=computeTarget(key,A.deload);

const it=A.q[A.idx],I=itemInfo(it),T=I.T,sub=A.subs[it.ex];
if(!draft||draft.idx!==A.idx)draft={idx:A.idx,w:I.d.bw?'0':(I.w==null?'':fmt(I.w)),r:String(it.k==='warm'?it.reps:(I.goal!=null?I.goal:I.range[0])),rpe:null};
let h=head+`<div class="bar" style="margin-bottom:4px"><div style="width:${Math.round(A.idx/A.q.length*100)}%"></div></div><div class="mu" style="margin-bottom:12px">Sett ${A.idx+1} av ${A.q.length}</div>`;
if(A.restEnd)h+='<div class="cd" style="background:var(--surface-1);border-color:transparent"><div class="r sb"><div><div class="mu">Hvile</div><div id="restT" style="font-size:32px;font-weight:500;font-variant-numeric:tabular-nums">–</div></div><div class="r" style="gap:6px"><button data-a="rm15">−15</button><button data-a="rp30">+30</button><button data-a="rskip" aria-label="Hopp over hvile"><i class="ti ti-player-skip-forward"></i></button></div></div><div class="bar" style="margin-top:10px"><div id="restBar" style="width:100%"></div></div></div>';
const dagMal=wTxt(I.d,T.w)+' × '+(I.d.t==='top'?T.goal:rt(I.d.r));
h+=`<div class="cd"><div class="r sb" style="align-items:flex-start"><div style="min-width:0"><div style="font-size:18px;font-weight:500">${I.name}</div>${sub?'<div class="mu">Bytte for '+ALL[it.ex].n+'</div>':''}</div><span class="ch">${I.label}</span></div>
<div class="r sb" style="margin-top:8px"><div style="min-width:0"><div style="font-size:14px">Dagens mål: <span style="font-weight:500">${dagMal}</span></div><div class="mu">${icon(T.status)} ${T.note}</div></div><button data-a="editT" style="height:32px;font-size:13px;padding:0 10px;flex:none">Endre</button></div>
${ui.editT?`<div class="r" style="margin-top:8px"><input id="tIn" inputmode="decimal" placeholder="${T.w==null?'80':fmt(T.w)}" style="flex:1;min-width:0"><button data-a="setT">Oppdater</button></div>`:''}
<div style="border-top:0.5px solid var(--border);margin-top:12px;padding-top:12px"><div class="mu">Neste</div><div style="font-size:30px;font-weight:500;line-height:1.25">${wTxt(I.d,I.w)} × ${it.k==='warm'?it.reps:rt(I.range)}</div>${I.d.bar&&I.w>0&&!sub?'<div class="mu" style="margin-top:2px"><i class="ti ti-circles"></i> '+plates(I.w)+'</div>':''}</div>
<div style="margin:10px 0 12px;font-size:14px"><div class="r sb" style="padding:3px 0"><span class="mu">Forrige</span><span>${I.prev?wTxt(I.d,I.prev.w)+' × '+I.prev.r+(I.prev.rpe?' @ '+I.prev.rpe:''):'–'}</span></div><div class="r sb" style="padding:3px 0"><span class="mu">Mål</span><span>${it.k==='warm'?'Lett og raskt':goalText(I)}</span></div>${it.k!=='warm'?'<div class="r sb" style="padding:3px 0"><span class="mu">Innsats</span><span style="font-weight:500">'+effort(it,I.d)+'</span></div>':''}${I.d.note&&it.k!=='warm'?'<div class="r sb" style="padding:3px 0"><span class="mu">Tips</span><span style="text-align:right">'+I.d.note+'</span></div>':''}<div class="r sb" style="padding:3px 0"><span class="mu">Hvile etter</span><span>${it.rest?mmss(it.rest):'Rett til neste øvelse'}</span></div></div>
<div class="g2"><div><div class="mu" style="margin-bottom:4px">${I.d.add?'Ekstra vekt (kg)':'Vekt (kg)'}</div>${I.d.bw?'<div class="mu" style="height:44px;display:flex;align-items:center">Kroppsvekt</div>':`<div class="r st" style="gap:4px"><button data-a="wm">−</button><input id="wIn" inputmode="decimal" value="${draft.w}"><button data-a="wp">+</button></div>`}</div><div><div class="mu" style="margin-bottom:4px">Reps</div><div class="r st" style="gap:4px"><button data-a="rm">−</button><input id="rIn" inputmode="numeric" value="${draft.r}"><button data-a="rp">+</button></div></div></div>
${it.k!=='warm'?'<div class="mu" style="margin:12px 0 4px">RPE <span style="color:var(--text-muted)">· 8 = 2 reps igjen, 10 = failure</span></div><div class="r" style="gap:6px">'+[6,7,8,9,10].map(v=>`<button data-a="rpe" data-v="${v}" class="${draft.rpe===v?'on':''}" style="flex:1;padding:0">${v}</button>`).join('')+'</div>':''}
${ui.err?'<div style="color:var(--text-danger);font-size:13px;margin-top:8px">'+ui.err+'</div>':''}
<button class="pr" data-a="done" style="margin-top:14px"><i class="ti ti-check"></i> Fullført sett</button>
<div class="g2" style="margin-top:8px"><button data-a="alts"><i class="ti ti-replace"></i> Utstyr opptatt</button><button data-a="skip">Hopp over sett</button></div>
${ui.alts?'<div style="margin-top:10px"><div class="mu" style="margin-bottom:6px">Velg alternativ med samme mål</div>'+ALL[it.ex].alts.map(a=>`<button data-a="alt" data-v="${a}" style="width:100%;margin-bottom:6px;text-align:left">${a}</button>`).join('')+'</div>':''}</div>`;
const up=A.q.slice(A.idx+1,A.idx+4);
if(up.length)h+='<div class="cd"><div class="mu" style="margin-bottom:4px">Deretter</div>'+up.map(x=>{const J=itemInfo(x);return `<div class="li"><span style="min-width:0">${J.name} <span class="mu">· ${J.label}</span></span><span style="white-space:nowrap">${wTxt(J.d,J.w)} × ${x.k==='warm'?x.reps:rt(J.range)}</span></div>`}).join('')+'</div>';
h+=`<div class="g2"><button data-a="end">${ui.cf==='end'?'Trykk igjen':'Avslutt nå'}</button><button data-a="disc2">${ui.cf==='disc2'?'Trykk igjen':'Forkast økt'}</button></div><button data-a="home" style="width:100%;margin-top:8px">Til oversikten</button>`;
return h}
function sumHTML(){const s=ui.sum;return `<div class="cd"><div class="r sb"><div><div class="mu">Økt fullført</div><div style="font-size:22px;font-weight:500">Økt ${s.n}</div></div><i class="ti ti-circle-check" style="font-size:24px;color:var(--text-success)"></i></div><div class="mu" style="margin:4px 0 12px">${s.week?'Uke '+s.week+' · ':''}Dag ${s.day+1} · ${P[s.day].n} · ${s.dur} min${s.deload?' · deload':s.intro?' · introuke':''}</div>
<div class="g2"><div class="mt"><div class="mu">Volum</div><div style="font-size:24px;font-weight:500">${(s.vol/1000).toFixed(1).replace('.',',')} tonn</div></div><div class="mt"><div class="mu">Mål nådd</div><div style="font-size:24px;font-weight:500">${s.met}/${s.tot}</div></div></div>`+
(s.prs.length?'<div style="margin-top:14px;font-weight:500">Personlige rekorder</div>'+s.prs.map(p=>`<div class="li"><span><i class="ti ti-trophy" style="color:var(--text-warning)"></i> ${p}</span></div>`).join(''):'')+
(s.changes.length?'<div style="margin-top:14px;font-weight:500">Endring fra forrige gang</div>'+s.changes.map(c=>`<div class="li"><span>${c.t}</span><i class="ti ti-${c.up?'arrow-up':'arrow-down'}" style="color:var(--text-${c.up?'success':'danger'})"></i></div>`).join(''):'')+
(sinceBackup()>=BACKUP_EVERY?`<div class="mt" style="margin-top:14px"><div class="r sb"><span style="font-size:14px">${sinceBackup()} økter uten backup</span><button data-a="dl" style="flex:none;height:36px"><i class="ti ti-download"></i> Lagre nå</button></div>${ui.msg?'<div style="color:var(--text-success);font-size:13px;margin-top:6px">'+ui.msg+'</div>':''}</div>`:'')+
'<button class="pr" data-a="home" style="margin-top:16px">Ferdig</button></div>'}
const root=document.getElementById('app');
function render(){if(ui.view==='work'&&!S.active)ui.view='home';if(ui.view==='sum'&&!ui.sum)ui.view='home';
if(ui.view==='work'&&S.active.phase==='sets'&&S.active.idx>=S.active.q.length){afterSets();if(!S.active)return}
charts.forEach(c=>c.destroy());charts=[];
root.innerHTML=ui.view==='work'?workHTML():ui.view==='sum'?sumHTML():homeHTML();if(ui.view==='home')drawCharts();tick()}
function tick(){const A=S.active;if(!A||ui.view!=='work')return;const now=Date.now(),el=document.getElementById('el');if(el)el.textContent=mmss((now-A.start)/1000);
if(A.phase==='sets'&&A.restEnd){const rem=(A.restEnd-now)/1000,t=document.getElementById('restT'),b=document.getElementById('restBar');if(t)t.textContent=rem>0?mmss(rem):'Klar';if(b)b.style.width=Math.max(0,Math.min(100,rem/A.restTot*100))+'%';if(rem<=0&&!beeped){beeped=true;beep(988,200,2)}}
if(A.phase==='fin'&&A.fin){const F=A.fin,e=F.el+(F.run?(now-F.t0)/1000:0);
if(e>=540){if(F.run){F.run=false;F.el=540;beep(988,250,3);save();render()}return}
const rd=Math.floor(e/90),w=e%90,hard=w<30,ph=rd*2+(hard?0:1),rem=hard?30-w:90-w;
const bx=document.getElementById('finBox'),p=document.getElementById('finP'),t=document.getElementById('finT'),r=document.getElementById('finR'),b=document.getElementById('finBar');
if(p){p.textContent=hard?'Hardt':'Rolig';p.style.color=hard?'var(--text-danger)':'var(--text-success)'}if(t)t.textContent=mmss(rem);if(r)r.textContent='Runde '+(rd+1)+' av 6';if(b)b.style.width=(e/540*100)+'%';if(bx)bx.style.background=(F.run||F.el>0)?(hard?'var(--bg-danger)':'var(--bg-success)'):'var(--surface-1)';
if(F.run&&ph!==lastPh){if(lastPh!==-2)beep(hard?1200:660,220,hard?2:1);lastPh=ph}}}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();tick();if(!S.sync.at||Date.now()-Date.parse(S.sync.at)>300000)syncNow()}});
root.addEventListener('input',e=>{if(!draft)return;if(e.target.id==='wIn'){draft.w=e.target.value}if(e.target.id==='rIn'){draft.r=e.target.value}});
root.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!root.contains(b))return;unlock();act(b.dataset.a,b.dataset.v)});
root.addEventListener('change',e=>{if(e.target.id!=='fileIn'||!e.target.files||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>readBackup(String(fr.result));fr.onerror=()=>{ui.ioErr='Kunne ikke lese fila.';render()};fr.readAsText(e.target.files[0])});
function act(a,v){const A=S.active;if(['discard','end','disc2'].includes(a)&&ui.cf!==a){ui.cf=a;render();return}ui.cf='';ui.msg='';if(!['doImp','impOk','impNo','pick'].includes(a))ui.ioErr='';
switch(a){
case 'sel':ui.sel=+v;break;
case 'start':start(ui.sel);return;
case 'resume':ui.view='work';break;
case 'discard':case 'disc2':S.active=null;draft=null;ui.view='home';save();break;
case 'end':finish();return;
case 'home':ui.view='home';ui.io=null;break;
case 'wkm':if(week().w>1){S.block.adj--;save()}break;
case 'wkp':S.block.adj++;save();break;
case 'newBlock':S.block={n:S.block.n+1,start:S.sessions.length,adj:0};save();break;
case 'dl':downloadBackup();return;
case 'pick':{const f=document.getElementById('fileIn');if(f){f.value='';f.click()}return}
case 'impOk':applyBackup();break;
case 'impNo':ui.pending=null;break;
case 'syncOn':{const el=document.getElementById('syncKey'),v=el?el.value.trim():'';if(v.length<16){S.sync.err='Nøkkelen må være minst 16 tegn.';break}
if(!setSyncKey(v)){S.sync.err='Kunne ikke lagre nøkkelen på enheten.';break}S.sync=freshSync();ui.syncMsg='';syncNow(true);return}
case 'syncNow':ui.syncMsg='';syncNow(true);return;
case 'syncOff':setSyncKey('');S.sync=freshSync();ui.syncMsg='';save();break;
case 'p125':S.settings.has125=!S.settings.has125;save();break;
case 'lift':ui.lift=v;break;
case 'wm':case 'wp':{const I=itemInfo(A.q[A.idx]);const st=I.d.bar?I.st:(I.d.inc||2.5);const cur=num(draft.w)||0;draft.w=fmt(Math.max(0,Math.round((cur+(a==='wp'?st:-st))*100)/100));ui.err='';break}
case 'rm':case 'rp':draft.r=String(Math.max(0,(parseInt(draft.r)||0)+(a==='rp'?1:-1)));ui.err='';break;
case 'rpe':draft.rpe=draft.rpe===+v?null:+v;break;
case 'done':complete();return;
case 'skip':A.idx++;draft=null;ui.alts=false;ui.editT=false;save();if(A.idx>=A.q.length){afterSets();if(!S.active)return}break;
case 'alts':ui.alts=!ui.alts;break;
case 'alt':sub(v);break;
case 'rm15':A.restEnd-=15000;break;
case 'rp30':A.restEnd+=30000;A.restTot+=30;beeped=false;break;
case 'rskip':A.restEnd=0;save();break;
case 'editT':ui.editT=!ui.editT;break;
case 'setT':{const val=num((document.getElementById('tIn')||{}).value);if(val!=null&&val>=0){const k=keyOf(A.q[A.idx].ex);A.targets[k].w=val;A.targets[k].note='Mål justert manuelt';draft=null;ui.editT=false;save()}break}
case 'finT':{const F=A.fin,now=Date.now();if(F.run){F.el+=(now-F.t0)/1000;F.run=false}else{if(F.el===0)lastPh=-1;F.t0=now;F.run=true}save();break}
case 'finSkip':case 'finDone':finish();return;
case 'exp':ui.io=ui.io==='exp'?null:'exp';ui.copied=false;break;
case 'imp':ui.io=ui.io==='imp'?null:'imp';ui.ioErr='';break;
case 'copy':{const t=document.getElementById('ioT');try{navigator.clipboard.writeText(t.value).then(()=>{ui.copied=true;S.backup={n:S.sessions.length,date:new Date().toISOString()};save();render()}).catch(()=>t.select())}catch(err){t&&t.select()}return}
case 'doImp':{const t=document.getElementById('ioT');readBackup(t?t.value:'');return}
}
render()}
render();setTimeout(()=>syncNow(),600);window.addEventListener('online',()=>syncNow());
</script>
</body>
</html>
